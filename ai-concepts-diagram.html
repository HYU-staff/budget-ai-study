<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 에이전트 · 하네스 · 스킬 · MCP 관계도</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #f7f8fa;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; color: #1f2937; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
  svg { max-width: 1000px; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>AI 에이전트는 어떻게 구성되는가</h1>
<p class="sub">비유: 회사에 새로 온 직원 한 명이 일하는 모습</p>

<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI 에이전트, 하네스, 스킬, MCP의 관계도">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ===== 에이전트 (가장 바깥) ===== -->
  <rect x="20" y="20" width="650" height="580" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="45" y="55" font-size="21" font-weight="700" fill="#4338ca">🤖 에이전트 (Agent)</text>
  <text x="45" y="78" font-size="13.5" fill="#4f46e5">목표를 받으면 스스로 계획하고, 도구를 쓰고, 결과를 확인하며 일하는 "직원" 전체</text>

  <!-- ===== 하네스 ===== -->
  <rect x="50" y="100" width="590" height="360" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="75" y="132" font-size="18" font-weight="700" fill="#0369a1">⚙️ 하네스 (Harness)</text>
  <text x="75" y="153" font-size="12.5" fill="#0284c7">모델이 실제로 "일"할 수 있게 해주는 몸과 작업 환경 — 예: Claude Code, Cowork</text>

  <!-- LLM -->
  <rect x="80" y="175" width="220" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="190" y="210" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">🧠 LLM (모델)</text>
  <text x="190" y="235" font-size="12" fill="#78350f" text-anchor="middle">두뇌: 읽고, 추론하고, 판단</text>
  <text x="190" y="255" font-size="12" fill="#78350f" text-anchor="middle">"다음에 뭘 할지" 결정</text>

  <!-- 도구 실행기 -->
  <rect x="390" y="175" width="220" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="500" y="210" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">🔧 도구 실행 (손발)</text>
  <text x="500" y="235" font-size="12" fill="#14532d" text-anchor="middle">파일 읽기·쓰기, 코드 실행,</text>
  <text x="500" y="255" font-size="12" fill="#14532d" text-anchor="middle">웹 검색, 외부 도구 호출</text>

  <!-- 루프 화살표 -->
  <path d="M 300 205 L 385 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="196" font-size="11.5" fill="#475569" text-anchor="middle">지시</text>
  <path d="M 385 265 L 300 265" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="284" font-size="11.5" fill="#475569" text-anchor="middle">결과 관찰</text>
  <text x="345" y="167" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">↻ 반복 루프</text>

  <!-- 컨텍스트/권한 관리 -->
  <rect x="80" y="315" width="530" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="338" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">🗂️ 하네스가 함께 관리하는 것</text>
  <text x="345" y="358" font-size="12" fill="#475569" text-anchor="middle">대화·작업 기억(컨텍스트), 권한·안전장치, 루프 제어</text>

  <!-- 스킬 -->
  <rect x="80" y="385" width="530" height="55" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="345" y="408" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">📚 스킬 (Skill) = 업무 매뉴얼·절차서</text>
  <text x="345" y="428" font-size="12" fill="#831843" text-anchor="middle">"보고서는 이 양식으로", "PPT는 이 절차로" — 필요할 때만 꺼내 읽는 노하우 문서</text>

  <!-- 스킬 → LLM 화살표 -->
  <path d="M 150 385 L 150 300" stroke="#db2777" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="160" y="345" font-size="11" fill="#9d174d">필요 시 로드</text>

  <!-- 사용자 → 에이전트 -->
  <rect x="230" y="510" width="230" height="60" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="345" y="535" font-size="14" font-weight="600" fill="#4338ca" text-anchor="middle">👤 사용자</text>
  <text x="345" y="556" font-size="12" fill="#4f46e5" text-anchor="middle">"이 일 좀 처리해 줘" (목표 지시)</text>
  <path d="M 345 510 L 345 465" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ===== MCP 포트 ===== -->
  <rect x="612" y="230" width="56" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="268" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">🔌</text>
  <text x="640" y="290" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">MCP</text>
  <text x="640" y="345" font-size="11.5" fill="#1d4ed8" text-anchor="middle">표준 커넥터</text>
  <text x="640" y="360" font-size="11.5" fill="#1d4ed8" text-anchor="middle">(USB-C 같은 규격)</text>

  <!-- ===== 외부 세계 ===== -->
  <text x="850" y="120" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">🌐 외부 시스템 (회사 밖·안의 다른 시스템)</text>

  <rect x="740" y="145" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="170" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">💬 Slack / 메신저</text>
  <text x="850" y="190" font-size="11.5" fill="#64748b" text-anchor="middle">메시지 읽기·보내기</text>

  <rect x="740" y="220" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="245" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">📁 Google Drive / 문서</text>
  <text x="850" y="265" font-size="11.5" fill="#64748b" text-anchor="middle">파일 검색·읽기</text>

  <rect x="740" y="295" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="320" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">🗄️ 사내 DB / 예산 시스템</text>
  <text x="850" y="340" font-size="11.5" fill="#64748b" text-anchor="middle">데이터 조회</text>

  <rect x="740" y="370" width="220" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="395" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">🎨 Figma / 캘린더 / 기타</text>
  <text x="850" y="415" font-size="11.5" fill="#64748b" text-anchor="middle">각종 서비스</text>

  <!-- MCP 연결선 -->
  <path d="M 668 258 C 700 240, 705 190, 735 176" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 668 270 C 700 265, 705 252, 735 250" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 668 285 C 700 292, 705 315, 735 322" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 668 298 C 700 320, 705 380, 735 396" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- ===== 하단 요약 ===== -->
  <rect x="20" y="625" width="940" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="653" font-size="13.5" fill="#1f2937">
    <tspan font-weight="700" fill="#4338ca">에이전트</tspan> = 일하는 직원 전체 &#160;·&#160;
    <tspan font-weight="700" fill="#0369a1">하네스</tspan> = 직원의 몸 + 작업 환경 &#160;·&#160;
    <tspan font-weight="700" fill="#92400e">LLM</tspan> = 두뇌
  </text>
  <text x="45" y="680" font-size="13.5" fill="#1f2937">
    <tspan font-weight="700" fill="#9d174d">스킬</tspan> = "어떻게 하는지" 아는 매뉴얼 (지식·절차) &#160;·&#160;
    <tspan font-weight="700" fill="#1d4ed8">MCP</tspan> = "어디까지 닿는지" 넓혀 주는 표준 연결 규격 (접근·연결)
  </text>
</svg>
</body>
</html>
