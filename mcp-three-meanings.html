<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP라는 한 단어가 가리키는 세 가지</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #f7f8fa;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 20px; color: #1f2937; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
  svg { max-width: 1120px; width: 100%; height: auto; }
</style>
</head>
<body>
<h1>"MCP"라는 한 단어가 가리키는 세 가지</h1>
<p class="sub">그림 1의 🔌 MCP와 그림 2의 예산운영지침 MCP 서버는 왜 둘 다 "MCP"인가</p>

<svg viewBox="0 0 1120 790" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCP 규격, 포트, 서버 개념 비교도">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== 상단: 세 가지 의미 칩 ===== -->
  <rect x="40" y="20" width="320" height="104" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="200" y="50" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">① 규격 (프로토콜)</text>
  <text x="200" y="74" font-size="12.5" fill="#6d28d9" text-anchor="middle">"이렇게 연결하자"는 약속 그 자체</text>
  <text x="200" y="96" font-size="12" fill="#7c3aed" text-anchor="middle">비유: USB-C 규격 문서</text>

  <rect x="400" y="20" width="320" height="104" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="50" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">② 포트 (클라이언트)</text>
  <text x="560" y="74" font-size="12.5" fill="#1d4ed8" text-anchor="middle">하네스에 내장된 "꽂는 자리"</text>
  <text x="560" y="96" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">= 그림 1의 🔌 MCP</text>

  <rect x="760" y="20" width="320" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="920" y="50" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">③ 서버 (기기)</text>
  <text x="920" y="74" font-size="12.5" fill="#15803d" text-anchor="middle">규격대로 도구를 제공하는 프로그램</text>
  <text x="920" y="96" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle">= 그림 2의 예산운영지침 MCP 서버</text>

  <!-- ===== 왼쪽 패널: USB-C 비유 ===== -->
  <rect x="40" y="160" width="500" height="450" rx="14" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="290" y="192" font-size="16" font-weight="700" fill="#3f3f46" text-anchor="middle">💻 USB-C로 보면</text>

  <!-- 노트북 -->
  <rect x="70" y="250" width="165" height="160" rx="12" fill="#ffffff" stroke="#52525b" stroke-width="2"/>
  <text x="152" y="310" font-size="30" text-anchor="middle">💻</text>
  <text x="152" y="345" font-size="14" font-weight="700" fill="#27272a" text-anchor="middle">노트북</text>
  <text x="152" y="367" font-size="11.5" fill="#52525b" text-anchor="middle">(일하는 본체)</text>

  <!-- 포트 -->
  <rect x="228" y="300" width="26" height="58" rx="5" fill="#e4e4e7" stroke="#52525b" stroke-width="2"/>
  <text x="241" y="382" font-size="11.5" font-weight="600" fill="#3f3f46" text-anchor="middle">USB-C 포트 ②</text>

  <!-- 케이블 -->
  <path d="M 254 315 C 300 300, 320 285, 363 274" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 254 329 C 300 335, 320 350, 363 362" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 254 343 C 300 370, 320 420, 363 448" stroke="#71717a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="305" y="262" font-size="11" fill="#52525b" text-anchor="middle">케이블·연결 방식은</text>
  <text x="305" y="277" font-size="11" fill="#52525b" text-anchor="middle">전부 같은 규격 ①</text>

  <!-- 기기들 -->
  <rect x="368" y="240" width="145" height="66" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.6"/>
  <text x="440" y="267" font-size="13" font-weight="600" fill="#3f3f46" text-anchor="middle">🗄️ 외장 SSD ③</text>
  <text x="440" y="288" font-size="11" fill="#71717a" text-anchor="middle">저장 기능 제공</text>

  <rect x="368" y="330" width="145" height="66" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.6"/>
  <text x="440" y="357" font-size="13" font-weight="600" fill="#3f3f46" text-anchor="middle">🖥️ 모니터 ③</text>
  <text x="440" y="378" font-size="11" fill="#71717a" text-anchor="middle">화면 기능 제공</text>

  <rect x="368" y="420" width="145" height="66" rx="10" fill="#ffffff" stroke="#a1a1aa" stroke-width="1.6"/>
  <text x="440" y="447" font-size="13" font-weight="600" fill="#3f3f46" text-anchor="middle">🌐 랜 허브 ③</text>
  <text x="440" y="468" font-size="11" fill="#71717a" text-anchor="middle">네트워크 기능 제공</text>

  <text x="290" y="545" font-size="12.5" font-weight="600" fill="#3f3f46" text-anchor="middle">"USB-C 샀어"라고만 하면 케이블인지 허브인지 모호한 것처럼,</text>
  <text x="290" y="567" font-size="12.5" font-weight="600" fill="#3f3f46" text-anchor="middle">"MCP"도 규격①·포트②·기기③ 중 무엇인지 문맥으로 구분</text>

  <!-- ===== 가운데 대응 기호 ===== -->
  <text x="560" y="340" font-size="26" font-weight="700" fill="#94a3b8" text-anchor="middle">≒</text>
  <text x="560" y="368" font-size="11" fill="#94a3b8" text-anchor="middle">서로 대응</text>

  <!-- ===== 오른쪽 패널: 실제 구조 ===== -->
  <rect x="580" y="160" width="500" height="450" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="830" y="192" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">🤖 실제 구조 (그림 1 + 그림 2)</text>

  <!-- 에이전트 -->
  <rect x="610" y="250" width="165" height="160" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="692" y="310" font-size="30" text-anchor="middle">🤖</text>
  <text x="692" y="345" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle">에이전트</text>
  <text x="692" y="367" font-size="11" fill="#4f46e5" text-anchor="middle">하네스 + LLM</text>
  <text x="692" y="384" font-size="10.5" fill="#6366f1" text-anchor="middle">(Claude Code·Cowork)</text>

  <!-- MCP 포트 -->
  <rect x="768" y="300" width="26" height="58" rx="5" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="781" y="382" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">🔌 MCP 클라이언트 ②</text>
  <text x="781" y="398" font-size="10.5" fill="#2563eb" text-anchor="middle">(그림 1의 그 포트)</text>

  <!-- 연결선 -->
  <path d="M 794 315 C 840 300, 860 285, 903 274" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 794 329 C 840 335, 860 350, 903 362" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 794 343 C 840 370, 860 420, 903 448" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="845" y="262" font-size="11" fill="#1d4ed8" text-anchor="middle">모든 연결이</text>
  <text x="845" y="277" font-size="11" fill="#1d4ed8" text-anchor="middle">MCP 프로토콜 ①</text>

  <!-- 서버들 -->
  <rect x="908" y="238" width="152" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="984" y="263" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">📗 예산운영지침</text>
  <text x="984" y="280" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">MCP 서버 ③</text>
  <text x="984" y="298" font-size="10" fill="#15803d" text-anchor="middle">← 기획처가 직접 만든 기기</text>

  <rect x="908" y="330" width="152" height="66" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="984" y="357" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">💬 Slack MCP 서버 ③</text>
  <text x="984" y="378" font-size="10.5" fill="#64748b" text-anchor="middle">메시지 기능 제공</text>

  <rect x="908" y="420" width="152" height="66" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="984" y="447" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">📁 Drive MCP 서버 ③</text>
  <text x="984" y="468" font-size="10.5" fill="#64748b" text-anchor="middle">파일 기능 제공</text>

  <text x="830" y="545" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">그림 1의 오른쪽 "외부 시스템" 자리에 꽂히는 기기가 늘어난 것 —</text>
  <text x="830" y="567" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">그중 하나(📗)를 확대한 그림이 그림 2</text>

  <!-- ===== 하단 요약 ===== -->
  <rect x="40" y="640" width="1040" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="65" y="672" font-size="13.5" fill="#1f2937">
    <tspan font-weight="700" fill="#1d4ed8">그림 1의 🔌 MCP</tspan> = 에이전트 쪽에서 본 이야기: "우리 하네스엔 표준 포트②가 있고 규격①대로 뭐든 꽂을 수 있다"
  </text>
  <text x="65" y="700" font-size="13.5" fill="#1f2937">
    <tspan font-weight="700" fill="#166534">그림 2의 예산운영지침 MCP 서버</tspan> = 기기 쪽에서 본 이야기: "그 포트에 꽂을 수 있는 기기③를 우리가 하나 만들었다"
  </text>
  <text x="65" y="728" font-size="13.5" fill="#1f2937">두 그림은 모순이 아니라 <tspan font-weight="700">배율 차이</tspan> — 같은 연결의 왼쪽 끝(포트)과 오른쪽 끝(기기)을 각각 그린 것</text>
  <text x="65" y="753" font-size="12" fill="#64748b">호칭 팁: ③을 말할 땐 "예산운영지침 MCP 서버"처럼 "서버"까지 붙이면 규격·포트와 혼동되지 않음</text>
</svg>
</body>
</html>
